# NeuroLearn AI — full stack.
# Usage:  docker compose up --build
# The app boots in offline mode (SQLite + TF-IDF + heuristic provider).
# Install Ollama separately and set the OLLAMA_* env to enable live LLMs.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neurolearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neurolearn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Point at the Postgres container instead of local SQLite.
      DATABASE_URL: postgresql+psycopg2://neuro:neuro@db:5432/neurolearn
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      UPLOAD_DIR: ./storage/uploads
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-tfidf}
    volumes:
      - uploads:/app/storage/uploads
      - appdata:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
  appdata:
